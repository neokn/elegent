name: Release

# 推 `vX.Y.Z` tag 觸發：跑完整測試 → 編譯 dist/elgt（macos-14 == arm64 runner，對應
# scripts/build.ts 鎖定的 bun-darwin-arm64 target）→ scripts/smoke.ts 端到端驗收
# compiled binary → 綠燈才建 GitHub Release，附上 binary 與 install.sh。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Verify tag matches src/core/version.ts VERSION
        run: |
          ACTUAL="v$(bun -e 'import{VERSION}from"./src/core/version.ts";console.log(VERSION)')"
          [ "$ACTUAL" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME ≠ version $ACTUAL"; exit 1; }

      - name: Build compiled binary
        run: bun run build

      - name: Smoke test compiled binary
        run: bun scripts/smoke.ts

      - name: Rename binary for release asset
        # gh release create's `file#label` syntax only sets a *display label* — the
        # uploaded asset keeps the local filename ("elgt"), which would break
        # install.sh's fixed download URL (.../releases/latest/download/elgt-darwin-arm64).
        # Renaming on disk first makes the asset's actual name match what install.sh expects.
        run: cp dist/elgt dist/elgt-darwin-arm64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/elgt-darwin-arm64 \
            install.sh \
            --generate-notes
